<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Authentication Error</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			text-align: center;
			padding: 50px 20px;
			background: #0a0a0a;
			color: #fff;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.container {
			background: linear-gradient(135deg, #3a1e1e 0%, #3a2d1e 100%);
			padding: 40px;
			border-radius: 16px;
			max-width: 500px;
			width: 100%;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
		}

		h1 {
			color: #d56f6f;
			margin: 0 0 20px 0;
			font-size: 28px;
		}

		.error-icon {
			font-size: 48px;
			margin-bottom: 10px;
		}

		p {
			color: #aaa;
			font-size: 16px;
			line-height: 1.5;
			margin: 10px 0;
		}

		code {
			background: #222;
			padding: 4px 8px;
			border-radius: 4px;
			color: #d56f6f;
			font-family: 'Courier New', monospace;
		}

		.details {
			margin-top: 20px;
			padding: 16px;
			background: rgba(0, 0, 0, 0.3);
			border-radius: 8px;
			text-align: left;
		}

		.details strong {
			color: #fff;
		}

		.close-btn {
			margin-top: 20px;
			padding: 12px 24px;
			background: #d56f6f;
			color: #fff;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
			transition: background 0.2s;
		}

		.close-btn:hover {
			background: #c05555;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="error-icon">❌</div>
		<h1>Authentication Failed</h1>
		<p><strong>Error:</strong> <code id="error-code">unknown_error</code></p>
		<div class="details">
			<p id="error-description">An unknown error occurred during authentication.</p>
		</div>
		<p style="margin-top: 20px;">Please close this window and try again.</p>
		<button class="close-btn" onclick="window.close()">Close Window</button>
	</div>

	<script>
		// Parse error from URL parameters
		const urlParams = new URLSearchParams(window.location.search);
		const errorCode = urlParams.get('error') || 'unknown_error';
		const errorDescription = urlParams.get('error_description') || 'An unknown error occurred during authentication.';

		// Display error details
		document.getElementById('error-code').textContent = errorCode;
		document.getElementById('error-description').textContent = decodeURIComponent(errorDescription);

		// Log for debugging
		console.error('OAuth Error:', {
			code: errorCode,
			description: errorDescription,
			url: window.location.href
		});
	</script>
</body>
</html>
